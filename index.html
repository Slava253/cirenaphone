<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система оповещения - Телефон</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0a1a1f 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        body.alarm-active-bg { animation: flashRed 0.3s infinite; }
        @keyframes flashRed {
            0% { background: linear-gradient(135deg, #0a0f1a 0%, #0a1a1f 100%); }
            100% { background: linear-gradient(135deg, #4a0000 0%, #2a0000 100%); }
        }
        .container { max-width: 500px; width: 100%; }
        .phone-panel {
            background: rgba(10, 20, 28, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 30px;
            border: 2px solid rgba(255, 100, 80, 0.4);
        }
        .connection-badge {
            display: inline-block;
            background: #2c5a3e;
            padding: 8px 20px;
            border-radius: 30px;
            color: #aaffaa;
            font-weight: bold;
            text-align: center;
            width: 100%;
        }
        .alarm-card {
            background: #031016;
            border-radius: 40px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
        }
        .alarm-status-icon { font-size: 4rem; margin-bottom: 15px; }
        .alarm-status-text { font-size: 1.8rem; font-weight: bold; }
        .safe-mode { color: #2ecc71; }
        .alarm-mode { color: #e74c3c; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .debug-box {
            background: #00000099;
            padding: 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #88ff88;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .footer { margin-top: 15px; font-size: 0.7rem; text-align: center; color: #b0a88c; }
        .manual-control { margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        .small-btn {
            background: #2c4f5e;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body id="phoneBody">
<div class="container">
    <div class="phone-panel">
        <div class="connection-badge" id="connectionBadge">🔌 ПОДКЛЮЧЕНИЕ...</div>
        
        <div class="alarm-card" id="alarmCard">
            <div class="alarm-status-icon" id="statusIcon">🟢</div>
            <div class="alarm-status-text safe-mode" id="statusMainText">БЕЗОПАСНО</div>
            <div id="statusSubText" style="color:#bbccdd;">Ожидание сигнала с компьютера</div>
        </div>
        
        <div class="debug-box" id="debugBox">
            🔍 ЛОГ СОБЫТИЙ:<br>
            ⏳ Инициализация...
        </div>
        
        <div class="manual-control">
            <button class="small-btn" id="stopTestBtn">⏹️ Остановить звук</button>
        </div>
        <div class="footer">
            📱 Телефон-приёмник<br>
            🔄 Автоматически получает команды с компьютера
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDbbkUV8yZd_i4g-6IJ_VPbQlh7uRp2kFg",
        authDomain: "alarm-system-88f83.firebaseapp.com",
        projectId: "alarm-system-88f83",
        storageBucket: "alarm-system-88f83.firebasestorage.app",
        messagingSenderId: "604735738788",
        appId: "1:604735738788:web:dc1a964f8e4692cbfa6731",
        measurementId: "G-CT25QT7CJD"
    };
    
    let database;
    let isAlarmActive = false;
    let currentAlarmAudio = null;
    let alarmSoundUrl = null;
    let clearSoundUrl = null;
    
    function addLog(msg) {
        const debugBox = document.getElementById('debugBox');
        const time = new Date().toLocaleTimeString();
        debugBox.innerHTML += `<br>⏰ ${time} - ${msg}`;
        debugBox.scrollTop = debugBox.scrollHeight;
        console.log(msg);
    }
    
    function initFirebase() {
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                addLog("✅ Firebase инициализирован");
            }
            database = firebase.database();
            
            const connectedRef = firebase.database().ref(".info/connected");
            connectedRef.on("value", (snap) => {
                if (snap.val() === true) {
                    addLog("✅ Подключено к Firebase");
                    document.getElementById('connectionBadge').innerHTML = '✅ ПОДКЛЮЧЕНО К СЕРВЕРУ';
                } else {
                    addLog("❌ Нет подключения");
                    document.getElementById('connectionBadge').innerHTML = '❌ НЕТ ПОДКЛЮЧЕНИЯ';
                }
            });
            return true;
        } catch (error) {
            addLog(`❌ Ошибка: ${error.message}`);
            return false;
        }
    }
    
    function stopAlarm() {
        if (currentAlarmAudio) {
            currentAlarmAudio.pause();
            currentAlarmAudio = null;
            addLog("⏹️ Звук остановлен");
        }
    }
    
    function startAlarmLoop() {
        if (!alarmSoundUrl) {
            addLog("⚠️ Нет звука тревоги!");
            return;
        }
        stopAlarm();
        const audio = new Audio(alarmSoundUrl);
        audio.loop = true;
        audio.play().catch(e => addLog(`❌ Ошибка воспроизведения: ${e.message}`));
        currentAlarmAudio = audio;
        addLog("🚨 Циклическое воспроизведение тревоги запущено");
    }
    
    async function playClearTwice() {
        if (!clearSoundUrl) {
            addLog("⚠️ Нет звука отбоя!");
            return;
        }
        addLog("🔔 Воспроизведение отбоя (2 раза)");
        for (let i = 0; i < 2; i++) {
            const audio = new Audio(clearSoundUrl);
            await new Promise((resolve) => {
                audio.play().catch(e => addLog(`❌ Ошибка: ${e.message}`));
                audio.onended = () => resolve();
                setTimeout(() => resolve(), 3000);
            });
            if (i === 0) await new Promise(r => setTimeout(r, 400));
        }
        addLog("✅ Отбой завершён");
    }
    
    function updateUI(active) {
        const body = document.getElementById('phoneBody');
        const icon = document.getElementById('statusIcon');
        const mainText = document.getElementById('statusMainText');
        const subText = document.getElementById('statusSubText');
        const alarmCard = document.getElementById('alarmCard');
        
        if (active) {
            body.classList.add('alarm-active-bg');
            icon.innerHTML = '🚨🔴🚨';
            mainText.innerHTML = 'ТРЕВОГА!';
            mainText.className = 'alarm-status-text alarm-mode';
            subText.innerHTML = '⚠️ УКРОЙТЕСЬ! ⚠️';
            alarmCard.style.background = '#4a0000cc';
        } else {
            body.classList.remove('alarm-active-bg');
            icon.innerHTML = '🟢';
            mainText.innerHTML = 'БЕЗОПАСНО';
            mainText.className = 'alarm-status-text safe-mode';
            subText.innerHTML = 'Ожидание сигнала с компьютера';
            alarmCard.style.background = '#031016';
        }
    }
    
    function activatePhoneAlarm() {
        if (isAlarmActive) return;
        isAlarmActive = true;
        updateUI(true);
        startAlarmLoop();
        addLog("🔴 ТРЕВОГА АКТИВИРОВАНА");
        
        // Отправляем подтверждение на компьютер
        database.ref('phoneResponses').push({
            action: 'alarm_received',
            time: Date.now()
        });
    }
    
    async function deactivatePhoneAlarm() {
        if (!isAlarmActive) return;
        isAlarmActive = false;
        stopAlarm();
        updateUI(false);
        await playClearTwice();
        addLog("✅ ОТБОЙ АКТИВИРОВАН");
        
        database.ref('phoneResponses').push({
            action: 'clear_received',
            time: Date.now()
        });
    }
    
    function listenForCommands() {
        const commandsRef = database.ref('commands');
        commandsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.type) {
                addLog(`📨 Получена команда: ${data.type} от ${data.from || 'компьютера'}`);
                if (data.type === 'alarm') {
                    activatePhoneAlarm();
                } else if (data.type === 'clear') {
                    deactivatePhoneAlarm();
                }
            }
        });
        addLog("👂 Слушаю команды...");
    }
    
    function listenForSounds() {
        database.ref('sounds/alarm').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.url) {
                alarmSoundUrl = data.url;
                addLog(`📥 Получен звук тревоги: ${data.name}`);
                if (isAlarmActive) {
                    stopAlarm();
                    startAlarmLoop();
                }
            }
        });
        
        database.ref('sounds/clear').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.url) {
                clearSoundUrl = data.url;
                addLog(`📥 Получен звук отбоя: ${data.name}`);
            }
        });
    }
    
    function listenAlarmState() {
        database.ref('alarmState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.active !== undefined) {
                addLog(`📊 Состояние из БД: ${data.active ? "ТРЕВОГА" : "БЕЗОПАСНО"}`);
                if (data.active && !isAlarmActive) {
                    activatePhoneAlarm();
                } else if (!data.active && isAlarmActive) {
                    deactivatePhoneAlarm();
                }
            }
        });
    }
    
    document.getElementById('stopTestBtn').addEventListener('click', () => {
        if (currentAlarmAudio) {
            stopAlarm();
            addLog("⏹️ Звук остановлен вручную");
        }
    });
    
    if (initFirebase()) {
        setTimeout(() => {
            addLog("📱 Телефон готов к приёму сигналов");
            listenForCommands();
            listenForSounds();
            listenAlarmState();
        }, 1000);
    }
    
    document.body.addEventListener('click', () => {
        if (isAlarmActive && currentAlarmAudio && currentAlarmAudio.paused) {
            currentAlarmAudio.play().catch(e => {});
        }
    }, { once: true });
</script>
</body>
</html>
